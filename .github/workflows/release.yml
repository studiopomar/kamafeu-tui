name: Build TUI releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            archive: kamafeu-tui-${{ github.ref_name }}-windows-x64.zip
            executable: build/bin/Release/kamafeu-tui.exe
          - name: macOS Apple Silicon
            runner: macos-15
            archive: kamafeu-tui-${{ github.ref_name }}-macos-arm64.tar.gz
            executable: build/bin/Release/kamafeu-tui
          - name: macOS Intel
            runner: macos-15-intel
            archive: kamafeu-tui-${{ github.ref_name }}-macos-x64.tar.gz
            executable: build/bin/Release/kamafeu-tui
          - name: Linux x64
            runner: ubuntu-latest
            archive: kamafeu-tui-${{ github.ref_name }}-linux-x64.tar.gz
            executable: build/bin/Release/kamafeu-tui
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libncurses-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test transport (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "${{ matrix.executable }}","README.md","LICENSE" package/
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package
          cp "${{ matrix.executable }}" README.md LICENSE package/
          tar -czf "${{ matrix.archive }}" -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
